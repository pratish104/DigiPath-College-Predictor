<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGIPATH_AI // INSTITUTE_DATABASE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-green: #00ff66;
    --neon-cyan: #00e5ff;
    --neon-magenta: #ff0055;
    --neon-amber: #ffb300;
    --bg-dark: #0a0e14;
    --bg-panel: #0d121b;
    --bg-card: #080c12;
    --border-green: rgba(0, 255, 102, 0.2);
    --border-green-solid: #00ff66;
    --text-dim: #008833;
    --text-mid: #00cc55;
    --scan-line: rgba(0, 255, 102, 0.03);
    --sidebar-width: 260px;
  }

  html, body {
    height: 100%;
    background: var(--bg-dark);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scan-line) 0px,
      var(--scan-line) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,102,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,102,0.04) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 0;
  }

  .app-container {
    display: flex;
    height: 100vh;
    width: 100vw;
    position: relative;
    z-index: 1;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-panel);
    border-right: 1px solid var(--border-green);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid var(--border-green);
    text-align: center;
  }

  .logo-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--neon-green);
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px rgba(0,255,102,0.6);
  }

  .nav-list {
    flex: 1;
    padding: 20px 0;
    list-style: none;
    overflow-y: auto;
  }

  .nav-item {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-mid);
    text-decoration: none;
    transition: all 0.2s;
    font-size: 13px;
    border-left: 3px solid transparent;
  }

  .nav-item:hover {
    background: rgba(0,255,102,0.05);
    color: var(--neon-green);
  }

  .nav-item.active {
    background: rgba(0,255,102,0.1);
    color: var(--neon-green);
    border-left-color: var(--neon-green);
    box-shadow: inset 5px 0 15px rgba(0,255,102,0.05);
  }

  .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  /* MAIN CONTENT */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(10,14,20,0.85);
  }

  .header {
    height: 64px;
    border-bottom: 1px solid var(--border-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    background: rgba(13, 18, 27, 0.9);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  /* FILTERS BAR */
  .filters-bar {
    padding: 16px 32px;
    border-bottom: 1px solid var(--border-green);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    background: rgba(8, 12, 18, 0.95);
  }

  .search-input {
    flex: 1;
    min-width: 280px;
    background: #05080c;
    border: 1px solid var(--border-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(0,255,102,0.25); }

  .filter-select {
    background: #05080c;
    border: 1px solid var(--border-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 10px 12px;
    outline: none;
    min-width: 140px;
  }

  .query-btn {
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .query-btn:hover {
    background: var(--neon-green);
    color: #000;
    box-shadow: 0 0 15px var(--neon-green);
  }

  /* INSTITUTE LIST */
  .content-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }

  .institute-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 24px;
  }

  .institute-card {
    background: var(--bg-card);
    border: 1px solid var(--border-green);
    border-top: 2px solid var(--neon-green);
    padding: 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: all 0.2s;
  }
  .institute-card:hover {
    border-color: var(--neon-green);
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0,255,102,0.15);
  }

  .inst-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .inst-name { font-family: 'Orbitron', sans-serif; font-size: 15px; color: var(--neon-green); line-height: 1.3; }
  .inst-dte { font-size: 11px; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 2px 6px; white-space: nowrap; }

  .inst-loc { font-size: 12px; color: var(--text-mid); }

  .inst-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    background: rgba(0,255,102,0.04);
    border: 1px solid rgba(0,255,102,0.1);
    padding: 10px;
  }
  .inst-stat-item { text-align: center; }
  .stat-label { font-size: 9px; color: var(--text-dim); margin-bottom: 2px; }
  .stat-val { font-size: 13px; color: var(--neon-green); font-weight: bold; }

  .inst-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid rgba(0,255,102,0.1);
  }

  .view-btn {
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 6px 14px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .view-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); }

  /* MODAL DRAWER */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-dialog {
    background: #080c12;
    border: 1px solid var(--neon-green);
    box-shadow: 0 0 30px rgba(0,255,102,0.25);
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    position: relative;
    animation: modalPop 0.25s ease-out;
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-close-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    background: transparent;
    border: 1px solid var(--neon-magenta);
    color: var(--neon-magenta);
    font-size: 16px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
  }
  .modal-close-btn:hover { background: var(--neon-magenta); color: #fff; }

  /* CORNERS */
  .corner {
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--neon-green);
    border-style: solid;
    opacity: 0.6;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: rgba(0,255,102,0.3); }
</style>
<link rel="stylesheet" href="/static/css/digipath-shell.css">
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-title">DIGIPATH_AI</div>
    </div>
    <nav class="nav-list">
      <a href="/dashboard" class="nav-item">
        <span class="nav-icon">▣</span>
        <span>DASHBOARD</span>
      </a>
      <a href="/predictor" class="nav-item">
        <span class="nav-icon">◈</span>
        <span>PREDICTOR</span>
      </a>
      <a href="/institutes" class="nav-item active">
        <span class="nav-icon">◉</span>
        <span>INSTITUTES</span>
      </a>
      <a href="/job-recommender" class="nav-item">
        <span class="nav-icon">▤</span>
        <span>JOB_MATCH</span>
      </a>
      <a href="/resume-analyzer" class="nav-item">
        <span class="nav-icon">▦</span>
        <span>RESUME_AI</span>
      </a>
      <a href="/roadmap" class="nav-item">
        <span class="nav-icon">➹</span>
        <span>ROADMAP</span>
      </a>
      <a href="/company-verification" class="nav-item">
        <span class="nav-icon">✓</span>
        <span>VERIFY_CORP</span>
      </a>
      <a href="/scam-detector" class="nav-item">
        <span class="nav-icon">⚠</span>
        <span>SCAM_DETECTOR</span>
      </a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="header">
      <div style="font-size: 14px; color: var(--neon-cyan)" id="clock">&gt; TIME: --:--:--</div>
      <div style="font-size: 11px; color: var(--text-mid)">DB_STATUS: LIVE // MAHARASHTRA_CAP</div>
    </header>

    <div class="filters-bar">
      <input type="text" class="search-input" placeholder="SEARCH_BY_NAME_OR_DTE_CODE (e.g. 03175, VJTI)..." id="instSearch">
      <select class="filter-select" id="cityFilter">
        <option value="ALL">ALL_CITIES</option>
      </select>
      <select class="filter-select" id="typeFilter">
        <option value="ALL">ALL_STATUSES</option>
      </select>
      <button class="query-btn" id="searchBtn">QUERY</button>
      <div style="font-size: 11px; color: var(--text-dim); margin-left: auto;" id="matchCount">LOADING...</div>
    </div>

    <div class="content-scroll">
      <div class="institute-grid" id="instGrid">
        <!-- Cards populated dynamically via static/js/app.js / API -->
      </div>
    </div>
  </main>
</div>

<!-- MODAL DRAWER FOR DETAILED INSTITUTE INTELLIGENCE -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-dialog">
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    <button class="modal-close-btn" onclick="closeDetailModal()">✕ CLOSE</button>
    <div id="modalContent">
      <!-- Injected by app.js -->
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/digipath-shell.js"></script>
<script>
function updateClock(){
  const now = new Date();
  const el = document.getElementById('clock');
  if(el) el.textContent = '> TIME: ' + now.toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

function closeDetailModal() {
  const m = document.getElementById('detailModal');
  if (m) m.style.display = 'none';
}
window.onclick = function(event) {
  const m = document.getElementById('detailModal');
  if (event.target === m) m.style.display = 'none';
};
</script>
</body>
</html>
