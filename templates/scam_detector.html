<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGIPATH_AI // SCAM_DETECTOR</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-green: #00ff41;
    --neon-cyan: #00e5ff;
    --neon-magenta: #ff00ff;
    --neon-amber: #ffb300;
    --bg-dark: #000000;
    --bg-panel: #050f05;
    --bg-card: #020a02;
    --border-green: #00ff4133;
    --border-green-solid: #00ff41;
    --text-dim: #006620;
    --text-mid: #00aa2b;
    --scan-line: rgba(0, 255, 65, 0.03);
    --sidebar-width: 260px;
  }

  html, body {
    height: 100%;
    background: var(--bg-dark);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scan-line) 0px,
      var(--scan-line) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* grid bg */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── LAYOUT ─── */
  .app-container {
    display: flex;
    height: 100vh;
    width: 100vw;
    position: relative;
    z-index: 1;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-panel);
    border-right: 1px solid var(--border-green);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid var(--border-green);
    text-align: center;
  }

  .logo-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--neon-green);
    letter-spacing: 0.1em;
    text-shadow: 0 0 10px rgba(0,255,65,0.5);
  }

  .nav-list {
    flex: 1;
    padding: 20px 0;
    list-style: none;
    overflow-y: auto;
  }

  .nav-item {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-mid);
    text-decoration: none;
    transition: all 0.2s;
    font-size: 13px;
    border-left: 3px solid transparent;
  }

  .nav-item:hover {
    background: rgba(0,255,65,0.05);
    color: var(--neon-green);
  }

  .nav-item.active {
    background: rgba(0,255,65,0.1);
    color: var(--neon-green);
    border-left-color: var(--neon-green);
    box-shadow: inset 5px 0 15px rgba(0,255,65,0.05);
  }

  /* ─── MAIN CONTENT ─── */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: rgba(0,0,0,0.6);
  }

  .header {
    height: 64px;
    border-bottom: 1px solid var(--border-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    background: rgba(5, 15, 5, 0.8);
    backdrop-filter: blur(10px);
  }

  /* ─── CONTENT AREA ─── */
  .content-area {
    padding: 32px;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }

  .page-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    color: var(--neon-green);
    margin-bottom: 32px;
    letter-spacing: 2px;
  }

  .detector-card {
    background: var(--bg-card);
    border: 1px solid var(--border-green);
    border-top: 2px solid var(--neon-green);
    padding: 32px;
    position: relative;
    margin-bottom: 32px;
  }

  .form-group { margin-bottom: 24px; }
  .form-label {
    display: block;
    font-size: 11px;
    color: var(--neon-cyan);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .offer-textarea {
    width: 100%;
    height: 200px;
    background: #000;
    border: 1px solid #00ff4140;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 15px;
    outline: none;
    resize: none;
    transition: all 0.2s;
  }
  .offer-textarea:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0,255,65,0.1); }

  .analyze-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 15px;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .analyze-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

  /* ─── RESULTS ─── */
  .result-panel {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-green);
    padding: 32px;
    position: relative;
    animation: fadeIn 0.5s;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(0,255,65,0.1);
  }

  .risk-gauge {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .risk-value { font-family: 'Orbitron'; font-size: 24px; font-weight: 900; }
  .risk-high { color: var(--neon-magenta); }
  .risk-low { color: var(--neon-green); }

  .red-flags {
    list-style: none;
  }
  .flag-item {
    padding: 12px;
    background: rgba(255, 0, 255, 0.05);
    border-left: 3px solid var(--neon-magenta);
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-mid);
  }
  .flag-item.safe {
    background: rgba(0, 255, 65, 0.05);
    border-left-color: var(--neon-green);
  }

  /* corner decorations */
  .corner {
    position: absolute;
    width: 10px; height: 10px;
    border-color: var(--neon-green);
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

</style>
</head>
<body>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-title">DIGIPATH_AI</div>
    </div>
    <nav class="nav-list">
      <a href="/dashboard" class="nav-item">
        <span class="nav-icon">▣</span>
        <span>DASHBOARD</span>
      </a>
      <a href="/predictor" class="nav-item">
        <span class="nav-icon">◈</span>
        <span>PREDICTOR</span>
      </a>
      <a href="/institutes" class="nav-item">
        <span class="nav-icon">◉</span>
        <span>INSTITUTES</span>
      </a>
      <a href="/resume-analyzer" class="nav-item">
        <span class="nav-icon">▦</span>
        <span>RESUME_AI</span>
      </a>
      <a href="/scam-detector" class="nav-item active">
        <span class="nav-icon">⚠</span>
        <span>SCAM_DETECTOR</span>
      </a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="header">
      <div id="clock" style="font-size: 14px; color: var(--neon-cyan)"></div>
      <div class="status-tag">SCAM_SHIELD: v2.1_ENABLED</div>
    </header>

    <div class="content-area">
      <h2 class="page-title">SCAM_DETECTOR_ENGINE</h2>

      <div class="detector-card">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>

        <div class="form-group">
          <label class="form-label">PASTE_OFFER_OR_EMAIL_CONTENT</label>
          <textarea class="offer-textarea" id="offerContent" placeholder="Include sender details, salary mentions, and specific requirements..."></textarea>
        </div>

        <button class="analyze-btn" onclick="analyzeScam()">⚡ INITIATE_SCAN</button>
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        
        <div class="result-header">
          <div class="risk-gauge">
            <span style="font-size: 11px; color: var(--text-dim);">RISK_LEVEL:</span>
            <span class="risk-value risk-high" id="riskValue">CRITICAL</span>
          </div>
          <div style="font-size: 11px; color: var(--neon-cyan);">VECTORS_ANALYZED: 42</div>
        </div>

        <div class="red-flags" id="flags">
          <!-- Flags will be injected here -->
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// Clock
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = '> TIME: ' + now.toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

function analyzeScam() {
  const content = document.getElementById('offerContent').value.trim();
  if(!content) { alert("Please provide offer content."); return; }

  const panel = document.getElementById('resultPanel');
  const riskValue = document.getElementById('riskValue');
  const flagsDiv = document.getElementById('flags');
  
  panel.style.display = 'block';
  
  // Simulated logic
  const isScam = content.toLowerCase().includes('payment') || content.toLowerCase().includes('whatsapp') || content.toLowerCase().includes('immediate joining');

  if(isScam) {
    riskValue.textContent = 'CRITICAL';
    riskValue.className = 'risk-value risk-high';
    flagsDiv.innerHTML = `
      <div class="flag-item">DETECTED: REQUEST_FOR_PAYMENT (SECURITY_DEPOSIT)</div>
      <div class="flag-item">DETECTED: UNVERIFIED_COMMUNICATION_CHANNEL (WHATSAPP)</div>
      <div class="flag-item">DETECTED: UNREALISTIC_SALARY_FOR_EXPERIENCE_RATIO</div>
      <div class="flag-item">DETECTED: URGENCY_PSYCHOLOGY_TACTIC</div>
    `;
  } else {
    riskValue.textContent = 'LOW_RISK';
    riskValue.className = 'risk-value risk-low';
    flagsDiv.innerHTML = `
      <div class="flag-item safe">VALIDATED: CORPORATE_EMAIL_DOMAIN_DETECTED</div>
      <div class="flag-item safe">VALIDATED: STANDARD_RECRUITMENT_WORKFLOW</div>
    `;
  }
}
</script>
</body>
</html>
