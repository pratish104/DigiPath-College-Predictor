<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGIPATH_AI // NEXT-GEN_CAREER_INTELLIGENCE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon-green: #00ff41;
    --neon-cyan: #00e5ff;
    --neon-magenta: #ff00ff;
    --neon-amber: #ffb300;
    --bg-dark: #000000;
    --bg-panel: #050f05;
    --bg-card: #020a02;
    --border-green: #00ff4133;
    --border-green-solid: #00ff41;
    --text-dim: #006620;
    --text-mid: #00aa2b;
    --scan-line: rgba(0, 255, 65, 0.03);
  }

  html, body {
    height: 100%;
    background: var(--bg-dark);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scan-line) 0px,
      var(--scan-line) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* grid bg */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .hero-section {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
  }

  .logo-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(40px, 10vw, 80px);
    font-weight: 900;
    color: var(--neon-green);
    letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(0,255,65,0.7);
    margin-bottom: 20px;
  }

  .hero-sub {
    font-size: clamp(14px, 2vw, 20px);
    color: var(--neon-cyan);
    letter-spacing: 0.3em;
    max-width: 800px;
    line-height: 1.6;
    margin-bottom: 40px;
  }

  .cta-group {
    display: flex;
    gap: 24px;
  }

  .btn-primary {
    background: transparent;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    padding: 16px 40px;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }
  .btn-primary:hover {
    background: var(--neon-green);
    color: #000;
    box-shadow: 0 0 30px var(--neon-green);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-family: 'Share Tech Mono', monospace;
    padding: 16px 40px;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }
  .btn-secondary:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 30px var(--neon-cyan);
  }

  /* ─── STATUS BAR ─── */
  .status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    background: #000;
    border-bottom: 1px solid var(--border-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 11px;
    color: var(--text-mid);
    z-index: 100;
  }

  @media (max-width: 600px) {
    .cta-group { flex-direction: column; gap: 15px; }
  }
</style>
</head>
<body>

<div class="status-bar">
  <div>SYSTEM_STATUS: ONLINE</div>
  <div id="clock"></div>
</div>

<main class="hero-section">
  <h1 class="logo-title">DIGIPATH_AI</h1>
  <p class="hero-sub">Empowering Students with AI-Driven Admission Predictions, Career Roadmaps, and Recruitment Security.</p>
  
  <div class="cta-group">
    <a href="/login" class="btn-primary">[ INITIALIZE_AUTH ]</a>
    <a href="/institutes" class="btn-secondary">[ BROWSE_COLLEGES ]</a>
  </div>
</main>

<script>
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = '> TIME: ' + now.toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
