<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGIPATH_AI // AUTHENTICATION</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --neon-green: #00ff41;
    --neon-cyan: #00e5ff;
    --neon-magenta: #ff00ff;
    --neon-amber: #ffb300;
    --bg-dark: #000000;
    --bg-panel: #050f05;
    --bg-card: #020a02;
    --border-green: #00ff4133;
    --border-green-solid: #00ff41;
    --text-dim: #006620;
    --text-mid: #00aa2b;
    --scan-line: rgba(0, 255, 65, 0.03);
  }
  html, body {
    height: 100%;
    background: var(--bg-dark);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, var(--scan-line) 0px, var(--scan-line) 1px, transparent 1px, transparent 2px);
    pointer-events: none;
    z-index: 9999;
  }
  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    background: #000;
    border-bottom: 1px solid var(--border-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 11px;
    color: var(--text-mid);
    z-index: 100;
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--neon-green);
    box-shadow: 0 0 6px var(--neon-green);
    animation: blink 2s infinite;
    margin-right: 5px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .login-container { width: 100%; max-width: 540px; }
  .logo-block { text-align: center; margin-bottom: 28px; }
  .logo-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--neon-green);
    letter-spacing: 0.12em;
    text-shadow: 0 0 20px rgba(0,255,65,0.7);
  }
  .card {
    background: var(--bg-card);
    border: 1px solid #00ff4155;
    border-top: 2px solid var(--neon-green);
    padding: 28px 32px 32px;
    position: relative;
  }
  .corner { position: absolute; width: 14px; height: 14px; border-color: var(--neon-green); border-style: solid; }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .tab-row { display: flex; margin-bottom: 24px; border: 1px solid #00ff4133; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    padding: 9px 0; cursor: pointer; border-right: 1px solid #00ff4133;
  }
  .tab-btn.active { background: rgba(0,255,65,0.1); color: var(--neon-green); }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 11px; color: var(--neon-cyan); margin-bottom: 6px; }
  .form-input {
    width: 100%; background: #000; border: 1px solid #00ff4140;
    color: var(--neon-green); font-family: 'Share Tech Mono', monospace;
    padding: 10px; outline: none;
  }
  .submit-btn {
    width: 100%; background: transparent; border: 1px solid var(--neon-green);
    color: var(--neon-green); font-family: 'Share Tech Mono', monospace;
    padding: 13px; cursor: pointer; margin-top: 10px;
  }
  .submit-btn:hover { background: var(--neon-green); color: #000; }
  .alert { display: none; padding: 10px; margin-bottom: 15px; font-size: 12px; border-left: 3px solid; }
  .alert.show { display: block; }
  .alert.error { border-color: #ff3333; color: #ff5555; background: rgba(255,0,0,0.05); }
  .alert.success { border-color: var(--neon-green); color: var(--neon-green); background: rgba(0,255,65,0.05); }
  .register-panel { display: none; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .role-card {
    border: 1px solid #00ff4130; padding: 8px; cursor: pointer; text-align: center; font-size: 11px;
  }
  .role-card.selected { border-color: var(--neon-green); background: rgba(0,255,65,0.1); }
  .auth-overlay {
    display: none; position: fixed; inset: 0; background: #000; z-index: 9999;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .auth-overlay.show { display: flex; }
</style>
</head>
<body>
<div class="status-bar">
  <div class="status-left"><span><span class="status-dot"></span>SYSTEM_ONLINE</span><span>DIGIPATH_AI // v4.1</span></div>
  <div class="status-right"><span class="active">AUTH_MODULE</span><span>SSL_SECURE</span></div>
</div>
<div class="auth-overlay" id="authOverlay">
  <div style="font-family:'Orbitron'; font-size: 24px; color: var(--neon-green); letter-spacing: 0.2em;">AUTHENTICATING...</div>
  <div id="overlayLog" style="margin-top: 20px; font-size: 12px;"></div>
</div>
<div class="page-wrapper">
  <div class="login-container">
    <div class="logo-block"><div class="logo-title">DIGIPATH_AI</div></div>
    <div class="card">
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div><div class="corner corner-br"></div>
      <div class="tab-row">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">[ LOGIN ]</button>
        <button class="tab-btn" id="tabReg" onclick="switchTab('register')">[ REGISTER ]</button>
      </div>
      <div id="alert" class="alert"></div>
      
      <!-- LOGIN -->
      <div id="loginPanel">
        <div class="form-group">
          <label class="form-label">> EMAIL_IDENTIFIER</label>
          <input class="form-input" type="email" id="loginEmail" placeholder="agent@digipath.ai">
        </div>
        <div class="form-group">
          <label class="form-label">> ACCESS_KEY</label>
          <input class="form-input" type="password" id="loginPass" placeholder="••••••••">
        </div>
        <button class="submit-btn" onclick="doLogin()"><span>⚡ INITIATE_AUTH</span></button>
      </div>

      <!-- REGISTER -->
      <div id="registerPanel" class="register-panel">
        <div class="form-group">
          <label class="form-label">> FULL_NAME</label>
          <input class="form-input" type="text" id="regName" placeholder="ENTER_NAME">
        </div>
        <div class="form-group">
          <label class="form-label">> EMAIL_ADDRESS</label>
          <input class="form-input" type="email" id="regEmail" placeholder="agent@digipath.ai">
        </div>
        <div class="form-group">
          <label class="form-label">> ACCESS_KEY</label>
          <input class="form-input" type="password" id="regPass" placeholder="MIN_8_CHARS">
        </div>
        <div class="form-group">
          <label class="form-label">> SELECT_ROLE</label>
          <div class="role-grid">
            <div class="role-card selected" onclick="selectRole(this)" data-role="USER">USER</div>
            <div class="role-card" onclick="selectRole(this)" data-role="ADMIN">ADMIN</div>
          </div>
        </div>
        <button class="submit-btn" onclick="doRegister()"><span>⚡ INITIALIZE_ACCOUNT</span></button>
      </div>
    </div>
  </div>
</div>
<script>
function switchTab(t){
  document.getElementById('loginPanel').style.display = t==='login'?'block':'none';
  document.getElementById('registerPanel').style.display = t==='register'?'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='register');
}
function selectRole(el){
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}
function showAlert(msg, type){
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass) return showAlert('MISSING FIELDS', 'error');
  
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await res.json();
    if(res.ok){
      document.getElementById('authOverlay').classList.add('show');
      setTimeout(() => window.location.href = '/dashboard', 1000);
    } else {
      showAlert(data.detail || 'AUTH FAILED', 'error');
    }
  } catch(e) { showAlert('CONNECTION ERROR', 'error'); }
}
async function doRegister(){
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const pass = document.getElementById('regPass').value;
  const role = document.querySelector('.role-card.selected').dataset.role;
  if(!name || !email || !pass) return showAlert('MISSING FIELDS', 'error');
  
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({full_name: name, email, password: pass, role})
    });
    const data = await res.json();
    if(res.ok){
      showAlert('ACCOUNT CREATED. PLEASE LOGIN.', 'success');
      switchTab('login');
    } else {
      showAlert(data.detail || 'REGISTRATION FAILED', 'error');
    }
  } catch(e) { showAlert('CONNECTION ERROR', 'error'); }
}

// Handle initial tab from server
{% if tab == 'register' %}
switchTab('register');
{% endif %}
</script>
</body>
</html>
